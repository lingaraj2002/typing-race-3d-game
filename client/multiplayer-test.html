<!doctype html>
<html>
  <head>
    <title>Multiplayer Test</title>
    <style>
      body {
        background: #000;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      #game-wrapper {
        position: relative;
        width: 100vw;
        max-width: calc(100vh * 16 / 9);
        aspect-ratio: 16 / 9;
        background: #1a1a2e;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="app"></div>
    </div>
    <script type="module" src="./src/multiplayerMain.js"></script>
    <!-- <script type="module" src="./src/multiplayerTest.js"></script> -->
  </body>
</html>
